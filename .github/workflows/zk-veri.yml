# /zk rakip takibi: her gün veriyi çekip zk/veri/ altına commit eder.
# Render ücretsiz planda disk kalıcı değil; geçmiş ve kampanya karşılaştırması bu kayıtlardan gelir.
name: zk-veri

on:
  schedule:
    - cron: "0 5 * * *"   # her gün 08:00 (TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 google-play-scraper openpyxl
      - run: python -m zk.veri_islem
      - name: Commit
        run: |
          git config user.name "zk-bot"
          git config user.email "zk-bot@users.noreply.github.com"
          git add zk/veri
          git diff --cached --quiet || git commit -m "zk: günlük veri $(date -u +%F)"
          git push
